<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>

    <h2>Please wait, you are being redirected...</h2>

    <script>
        // 1. Get the parameter from the URL
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const vParam = urlParams.get('v');

        // 2. If the parameter is 'free-game', redirect immediately
        if (vParam === 'free-game') {
            window.location.href = "https://shototaagro.shop";
        } else if (vParam) {
            // Dynamic redirect based on any other parameter name
            window.location.href = `https://shototaagro.shop${vParam}`;
        } else {
            document.body.innerHTML = "<h2>Error: Missing routing parameter.</h2>";
        }
    </script>

</body>
</html>
